<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>شحن السيارة | مُر EV Charging</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body>
<nav class="navbar navbar-dark bg-brand-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark"></a>
  </div>
</nav>

<div class="container py-4" style="max-width:480px">
  <div id="loadingBox" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
    <p class="text-muted mt-3">جاري تحميل بيانات المحطة...</p>
  </div>

  <div id="notFoundBox" class="d-none text-center py-5">
    <i class="bi bi-exclamation-triangle fs-1 text-danger mb-3"></i>
    <h5>ما لكينا هذه المحطة</h5>
    <p class="text-muted">تأكد من رابط QR Code أو تواصل مع فريق مُر.</p>
  </div>

  <div id="stationBox" class="d-none">
    <div class="card p-4 shadow-sm mb-3 text-center">
      <h4 id="stationName" class="mb-1"></h4>
      <p class="text-muted small mb-2" id="stationLocation"></p>
      <div class="d-flex justify-content-center gap-2 mb-2">
        <span class="status-badge" id="connectorStatusBadge"></span>
        <span class="text-muted small" id="connectorLabel"></span>
      </div>
      <p class="mb-0"><strong id="priceLabel"></strong></p>
    </div>

    <!-- STEP 1: identify -->
    <div id="identifyBox" class="card p-4 shadow-sm">
      <h6 class="fw-bold mb-3"><i class="bi bi-person-check"></i> عرّف عن نفسك</h6>

      <ul class="nav nav-pills nav-justified mb-3" id="identifyTabs">
        <li class="nav-item"><button class="nav-link active" data-mode="rfid" type="button">بطاقة RFID</button></li>
        <li class="nav-item"><button class="nav-link" data-mode="code" type="button">كود ورقم سري</button></li>
      </ul>

      <form id="identifyForm">
        <input class="form-control mb-2" id="tagInput" dir="ltr" placeholder="كود بطاقة RFID" required>
        <button class="btn btn-brand w-100" type="submit">متابعة</button>
      </form>

      <form id="codeIdentifyForm" class="d-none">
        <input class="form-control mb-2" id="codeInput" dir="ltr" placeholder="كود الساكن (مثلاً: D14-101)" required>
        <input class="form-control mb-2" id="pinInput" dir="ltr" placeholder="الرقم السري (PIN)" required>
        <button class="btn btn-brand w-100" type="submit">متابعة</button>
      </form>

      <small id="identifyStatus" class="d-block mt-2"></small>
      <p class="text-muted small mt-3 mb-0">ماكو بطاقة ولا كود بعد؟ <a href="wallet-topup.html">اطلب وحدة من هنا</a>.</p>
    </div>

    <!-- STEP 2: customer + start -->
    <div id="customerBox" class="card p-4 shadow-sm d-none">
      <p class="mb-2">مرحبًا <strong id="customerName"></strong></p>
      <div class="row text-center mb-2">
        <div class="col-4">
          <div class="text-muted small mb-1">الرصيد</div>
          <strong id="customerBalance"></strong>
        </div>
        <div class="col-4">
          <div class="text-muted small mb-1">إجمالي الاستهلاك</div>
          <strong id="customerTotalKwh"></strong>
        </div>
        <div class="col-4">
          <div class="text-muted small mb-1">إجمالي المصروف</div>
          <strong id="customerTotalSpent"></strong>
        </div>
      </div>
      <p class="text-muted small text-center mb-3">هالأسبوع: <strong id="customerWeekKwh"></strong> · <strong id="customerWeekSpent"></strong></p>
      <div id="balanceWarning" class="alert alert-warning small d-none">رصيدك غير كافٍ لبدء جلسة شحن. <a href="wallet-topup.html">عبّي محفظتك من هنا</a>.</div>
      <div id="busyWarning" class="alert alert-warning small d-none">المحطة مشغولة حاليًا أو غير متاحة.</div>
      <button id="startBtn" class="btn btn-brand w-100">⚡ ابدأ الشحن</button>
      <small id="startStatus" class="d-block mt-2"></small>
    </div>
  </div>
</div>

<script type="module" src="assets/js/charge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
