<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تعبئة المحفظة | مُر EV Charging</title>
  <meta name="description" content="عبّي محفظتك لشحن سيارتك الكهربائية عبر محطات مُر، أو اطلب بطاقة RFID.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body>
<nav class="navbar navbar-dark bg-brand-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark"></a>
  </div>
</nav>

<div class="container py-5" style="max-width:520px">
  <div class="text-center mb-4">
    <h2>محفظة الشحن</h2>
    <p class="text-muted">عبّي رصيدك لشحن سيارتك من محطات مُر، أو اطلب بطاقة RFID</p>
  </div>

  <ul class="nav nav-pills nav-justified mb-4" id="modeTabs">
    <li class="nav-item"><button class="nav-link active" data-mode="topup" type="button">تعبئة المحفظة</button></li>
    <li class="nav-item"><button class="nav-link" data-mode="rfid" type="button">طلب بطاقة RFID</button></li>
  </ul>

  <!-- TOP-UP -->
  <form id="topupForm" class="card p-4 shadow-sm">
    <input class="form-control mb-3" name="name" placeholder="الاسم" required>
    <input class="form-control mb-3" type="tel" name="phone" placeholder="رقم الهاتف" required>

    <label class="form-label small text-muted mb-1">اختر مبلغ التعبئة (IQD)</label>
    <div class="row g-2 mb-2" id="amountButtons">
      <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 amount-btn" data-amount="5000">5,000</button></div>
      <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 amount-btn" data-amount="10000">10,000</button></div>
      <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 amount-btn" data-amount="50000">50,000</button></div>
    </div>
    <input class="form-control mb-3" type="number" min="1000" step="1000" name="amount" id="amountInput" placeholder="أو اكتب مبلغ آخر" required>

    <label class="form-label small text-muted mb-1">طريقة الدفع</label>
    <div class="mb-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="method" id="methodMaster" value="mastercard" checked>
        <label class="form-check-label" for="methodMaster">ماستركارد</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="method" id="methodZain" value="zaincash">
        <label class="form-check-label" for="methodZain">زين كاش</label>
      </div>
    </div>

    <div class="alert alert-warning small">
      <i class="bi bi-info-circle"></i>
      بوابة الدفع الإلكتروني قيد التفعيل حاليًا. بعد إرسال الطلب راح يتواصل معك فريقنا لإتمام عملية الدفع، وبعدها يتفعّل الرصيد بمحفظتك.
    </div>

    <button class="btn btn-brand w-100" type="submit">إرسال طلب التعبئة</button>
    <small id="topupStatus" class="mt-2 d-block"></small>
  </form>

  <!-- RFID -->
  <form id="rfidForm" class="card p-4 shadow-sm d-none">
    <input class="form-control mb-3" name="name" placeholder="الاسم" required>
    <input class="form-control mb-3" type="tel" name="phone" placeholder="رقم الهاتف" required>
    <p class="text-muted small">راح يتواصل معك فريقنا لتسليم بطاقة RFID وربطها بحسابك.</p>
    <button class="btn btn-brand w-100" type="submit">إرسال طلب البطاقة</button>
    <small id="rfidStatus" class="mt-2 d-block"></small>
  </form>
</div>

<script type="module" src="assets/js/wallet-topup.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
