<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>العملاء المحتملون | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark" style="height:2.1rem"></div>
    <nav>
      <a href="dashboard.html"><i class="bi bi-grid"></i> لوحة التحكم</a>
      <a href="companies.html"><i class="bi bi-building"></i> الشركات</a>
      <a class="active" href="leads.html"><i class="bi bi-person-lines-fill"></i> العملاء المحتملون</a>
      <a href="tasks.html"><i class="bi bi-check2-square"></i> المهام</a>
      <a href="quotes.html"><i class="bi bi-file-earmark-text"></i> عروض الأسعار</a>
      <a href="users.html"><i class="bi bi-people"></i> المستخدمون</a>
      <a href="marketing.html"><i class="bi bi-megaphone"></i> التسويق</a>
      <a href="settings.html"><i class="bi bi-gear"></i> الإعدادات</a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2>العملاء المحتملون</h2>
        <p class="text-muted mb-0">الطلبات الواردة من نموذج "اطلب دراسة" بالموقع</p>
      </div>
      <div class="d-flex gap-2">
        <button id="exportBtn" class="btn btn-outline-secondary"><i class="bi bi-download"></i> تصدير Excel</button>
        <button id="logoutBtn" class="btn btn-outline-danger">تسجيل الخروج</button>
      </div>
    </div>

    <div class="data-toolbar">
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <select id="statusFilter" class="form-select" style="max-width:220px">
          <option value="all">كل الحالات</option>
          <option value="new">جديد</option>
          <option value="contacted">تم التواصل</option>
          <option value="closed">مغلق</option>
        </select>
        <button id="deleteSelectedBtn" class="btn btn-outline-danger btn-sm d-none"><i class="bi bi-trash"></i> حذف المحدد (<span id="selectedCount">0</span>)</button>
        <button id="deleteAllBtn" class="btn btn-outline-danger btn-sm d-none"><i class="bi bi-trash3"></i> حذف الكل</button>
      </div>
      <span class="text-muted small" id="countLabel"></span>
    </div>

    <div class="data-table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" id="selectAllCheckbox" class="d-none"></th>
            <th>الاسم</th>
            <th>الجهة</th>
            <th>الهاتف</th>
            <th>النوع</th>
            <th>التفاصيل</th>
            <th>التاريخ</th>
            <th>المتابعة القادمة</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <tr><td colspan="10" class="empty-state">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Lead Follow-up Modal -->
  <div class="modal fade" id="leadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="leadModalTitle">متابعة العميل</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="leadModalInfo" class="mb-3"></div>

          <div class="mb-3">
            <label class="form-label fw-bold">تاريخ المتابعة القادمة</label>
            <div class="d-flex gap-2">
              <input type="date" id="nextFollowUp" class="form-control">
              <button type="button" id="saveFollowUpBtn" class="btn btn-brand text-nowrap">حفظ</button>
            </div>
          </div>

          <hr>
          <h6 class="fw-bold mb-2">سجل المتابعة</h6>
          <div id="activityLog" style="max-height:220px;overflow:auto" class="mb-3"></div>

          <div class="input-group">
            <textarea id="newActivityText" class="form-control" rows="2" placeholder="اكتب ملاحظة: مثلاً - اتصلت به، قال يفكر بالعرض..."></textarea>
          </div>
          <button type="button" id="addActivityBtn" class="btn btn-outline-secondary btn-sm mt-2"><i class="bi bi-plus-lg"></i> إضافة ملاحظة</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/leads.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</body>
</html>
