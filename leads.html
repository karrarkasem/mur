<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>العملاء المحتملون | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark" style="height:2.1rem"></div>
    <nav>
      <a href="dashboard.html"><i class="bi bi-grid"></i> لوحة التحكم</a>
      <a href="companies.html"><i class="bi bi-building"></i> الشركات</a>
      <a class="active" href="leads.html"><i class="bi bi-person-lines-fill"></i> العملاء المحتملون</a>
      <a href="tasks.html"><i class="bi bi-check2-square"></i> المهام</a>
      <a href="quotes.html"><i class="bi bi-file-earmark-text"></i> عروض الأسعار</a>
      <a href="users.html"><i class="bi bi-people"></i> المستخدمون</a>
      <a href="marketing.html"><i class="bi bi-megaphone"></i> التسويق</a>
      <a href="settings.html"><i class="bi bi-gear"></i> الإعدادات</a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2>العملاء المحتملون</h2>
        <p class="text-muted mb-0">الطلبات الواردة من نموذج "اطلب دراسة" بالموقع</p>
      </div>
      <button id="logoutBtn" class="btn btn-outline-danger">تسجيل الخروج</button>
    </div>

    <div class="data-toolbar">
      <select id="statusFilter" class="form-select" style="max-width:220px">
        <option value="all">كل الحالات</option>
        <option value="new">جديد</option>
        <option value="contacted">تم التواصل</option>
        <option value="closed">مغلق</option>
      </select>
      <span class="text-muted small" id="countLabel"></span>
    </div>

    <div class="data-table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th>الاسم</th>
            <th>الجهة</th>
            <th>الهاتف</th>
            <th>النوع</th>
            <th>التفاصيل</th>
            <th>التاريخ</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <tr><td colspan="8" class="empty-state">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module" src="assets/js/leads.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
