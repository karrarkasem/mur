<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>المهام | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark" style="height:2.1rem"></div>
    <nav>
      <a href="dashboard.html"><i class="bi bi-grid"></i> لوحة التحكم</a>
      <a href="companies.html"><i class="bi bi-building"></i> الشركات</a>
      <a href="leads.html"><i class="bi bi-person-lines-fill"></i> العملاء المحتملون</a>
      <a class="active" href="tasks.html"><i class="bi bi-check2-square"></i> المهام</a>
      <a href="quotes.html"><i class="bi bi-file-earmark-text"></i> عروض الأسعار</a>
      <a href="users.html"><i class="bi bi-people"></i> المستخدمون</a>
      <a href="#"><i class="bi bi-megaphone"></i> التسويق</a>
      <a href="#"><i class="bi bi-gear"></i> الإعدادات</a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2>المهام</h2>
        <p class="text-muted mb-0">مهام الفريق، مين مسؤول عنها، وشنو وضعها الحالي</p>
      </div>
      <div class="d-flex gap-2">
        <button id="addBtn" class="btn btn-brand"><i class="bi bi-plus-lg"></i> إضافة مهمة</button>
        <button id="logoutBtn" class="btn btn-outline-danger">تسجيل الخروج</button>
      </div>
    </div>

    <div class="data-toolbar">
      <div class="d-flex gap-2 flex-wrap">
        <select id="statusFilter" class="form-select" style="max-width:200px">
          <option value="all">كل الحالات</option>
          <option value="pending">قيد التنفيذ</option>
          <option value="blocked">متعثرة (يوجد معوق)</option>
          <option value="done">مكتملة</option>
        </select>
        <div class="form-check d-flex align-items-center gap-2 ms-2">
          <input class="form-check-input" type="checkbox" id="myTasksOnly">
          <label class="form-check-label" for="myTasksOnly">مهامي فقط</label>
        </div>
      </div>
      <span class="text-muted small" id="countLabel"></span>
    </div>

    <div class="data-table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th>المهمة</th>
            <th>النوع</th>
            <th>موكلة إلى</th>
            <th>تاريخ الاستحقاق</th>
            <th>الأولوية</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tasksBody">
          <tr><td colspan="7" class="empty-state">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="taskForm">
          <div class="modal-header">
            <h5 class="modal-title" id="taskModalTitle">إضافة مهمة</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="taskId">
            <div class="mb-3"><label class="form-label">المهمة *</label><input required id="title" class="form-control"></div>
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">نوع المهمة</label>
                <select id="type" class="form-select">
                  <option value="installation">تركيب</option>
                  <option value="maintenance">صيانة</option>
                  <option value="site_survey">دراسة موقع</option>
                  <option value="follow_up">متابعة عميل</option>
                  <option value="admin">إداري</option>
                  <option value="other">أخرى</option>
                </select>
              </div>
              <div class="col-md-6 mb-3"><label class="form-label">موكلة إلى</label>
                <select id="assignedTo" class="form-select">
                  <option value="">— غير محددة —</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">تاريخ الاستحقاق</label><input type="date" id="dueDate" class="form-control"></div>
              <div class="col-md-6 mb-3"><label class="form-label">الأولوية</label>
                <select id="priority" class="form-select">
                  <option value="low">منخفضة</option>
                  <option value="medium" selected>متوسطة</option>
                  <option value="high">عالية</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">الحالة</label>
              <select id="status" class="form-select">
                <option value="pending">قيد التنفيذ</option>
                <option value="blocked">متعثرة (يوجد معوق)</option>
                <option value="done">مكتملة</option>
              </select>
            </div>
            <div class="mb-3" id="blockerWrap" style="display:none">
              <label class="form-label">شنو المعوق؟</label>
              <textarea id="blockerNotes" class="form-control" rows="2" placeholder="مثال: بانتظار توريد الجهاز من المورد"></textarea>
            </div>
            <div class="mb-3"><label class="form-label">ملاحظات</label><textarea id="notes" class="form-control" rows="2"></textarea></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
            <button type="submit" class="btn btn-brand">حفظ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/tasks.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
