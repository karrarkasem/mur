<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة التحكم | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark" style="height:2.1rem"></div>
    <nav>
      <a class="active" href="#"><i class="bi bi-grid"></i> لوحة التحكم</a>
      <a href="#"><i class="bi bi-building"></i> الشركات</a>
      <a href="#"><i class="bi bi-person-lines-fill"></i> جهات الاتصال</a>
      <a href="#"><i class="bi bi-check2-square"></i> المهام</a>
      <a href="#"><i class="bi bi-calendar-event"></i> المتابعات</a>
      <a href="#"><i class="bi bi-megaphone"></i> التسويق</a>
      <a href="#"><i class="bi bi-file-earmark-text"></i> عروض الأسعار</a>
      <a href="#"><i class="bi bi-gear"></i> الإعدادات</a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2>مرحبًا بك في MUR Business Platform</h2>
        <p class="text-muted mb-0">ملخص النشاط والأداء</p>
      </div>
      <button id="logoutBtn" class="btn btn-outline-danger">تسجيل الخروج</button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="kpi"><span>الشركات</span><strong id="companiesCount">0</strong></div></div>
      <div class="col-md-3"><div class="kpi"><span>العملاء المحتملون</span><strong id="leadsCount">0</strong></div></div>
      <div class="col-md-3"><div class="kpi"><span>المهام</span><strong id="tasksCount">0</strong></div></div>
      <div class="col-md-3"><div class="kpi"><span>العروض</span><strong id="quotesCount">0</strong></div></div>
    </div>

    <div class="card p-4 shadow-sm">
      <h5>المستخدم الحالي</h5>
      <div id="userInfo">جاري التحميل...</div>
    </div>
  </main>

  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
