<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الإعدادات | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark" style="height:2.1rem"></div>
    <nav>
      <a href="dashboard.html"><i class="bi bi-grid"></i> لوحة التحكم</a>
      <a href="companies.html"><i class="bi bi-building"></i> الشركات</a>
      <a href="leads.html"><i class="bi bi-person-lines-fill"></i> العملاء المحتملون</a>
      <a href="tasks.html"><i class="bi bi-check2-square"></i> المهام</a>
      <a href="quotes.html"><i class="bi bi-file-earmark-text"></i> عروض الأسعار</a>
      <a href="users.html"><i class="bi bi-people"></i> المستخدمون</a>
      <a href="marketing.html"><i class="bi bi-megaphone"></i> التسويق</a>
      <a href="trash.html"><i class="bi bi-trash3"></i> سلة المحذوفات</a>
      <a class="active" href="settings.html"><i class="bi bi-gear"></i> الإعدادات</a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2>الإعدادات</h2>
        <p class="text-muted mb-0">حسابك ومعلومات الشركة المستخدمة بعروض الأسعار</p>
      </div>
      <button id="logoutBtn" class="btn btn-outline-danger">تسجيل الخروج</button>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card p-4 shadow-sm h-100">
          <h5 class="mb-3"><i class="bi bi-person-circle"></i> حسابي</h5>
          <p class="text-muted small mb-3" id="accountEmail"></p>

          <form id="passwordForm">
            <div class="mb-3">
              <label class="form-label">كلمة المرور الحالية</label>
              <input required type="password" id="currentPassword" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">كلمة المرور الجديدة</label>
              <input required type="password" id="newPassword" class="form-control" minlength="6" placeholder="6 أحرف على الأقل">
            </div>
            <div class="mb-3">
              <label class="form-label">تأكيد كلمة المرور الجديدة</label>
              <input required type="password" id="confirmPassword" class="form-control" minlength="6">
            </div>
            <button type="submit" class="btn btn-brand">تحديث كلمة المرور</button>
            <div id="passwordStatus" class="small mt-2"></div>
          </form>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card p-4 shadow-sm h-100">
          <h5 class="mb-3"><i class="bi bi-building"></i> معلومات الشركة</h5>
          <p class="text-muted small mb-3">تظهر هذي المعلومات بترويسة عروض الأسعار المطبوعة. التعديل هنا متاح للمدير (Admin) فقط.</p>

          <form id="companyForm">
            <div class="mb-3"><label class="form-label">اسم الشركة</label><input id="companyName" class="form-control" value="مُر - حلول شحن السيارات الكهربائية"></div>
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">الهاتف</label><input id="companyPhone" class="form-control" value="07711763931"></div>
              <div class="col-md-6 mb-3"><label class="form-label">الإيميل</label><input type="email" id="companyEmail" class="form-control" value="mur.ev.iq@gmail.com"></div>
            </div>
            <div class="mb-3"><label class="form-label">العنوان</label><input id="companyAddress" class="form-control" value="بغداد - العراق"></div>
            <div class="mb-3"><label class="form-label">الموقع الإلكتروني</label><input id="companyWebsite" class="form-control" value="www.mur.ev.iq"></div>
            <button type="submit" id="companySaveBtn" class="btn btn-brand">حفظ معلومات الشركة</button>
            <div id="companyStatus" class="small mt-2"></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="assets/js/settings.js"></script>
</body>
</html>
