<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>خريطة المحطات | إدارة الشحن | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark" style="height:2.1rem"></div>
    <p class="ev-sidebar-title">MUR EV Charging</p>
    <nav>
      <a href="ev-dashboard.html"><i class="bi bi-speedometer2"></i> لوحة المتابعة</a>
      <a href="ev-chargers.html"><i class="bi bi-ev-station"></i> المحطات</a>
      <a class="active" href="ev-station-map.html"><i class="bi bi-grid-3x3-gap"></i> خريطة المحطات</a>
      <a href="ev-customers.html"><i class="bi bi-person-badge"></i> العملاء وRFID</a>
      <a href="ev-sessions.html"><i class="bi bi-lightning-charge"></i> جلسات الشحن</a>
      <a href="ev-wallet.html"><i class="bi bi-cash-coin"></i> طلبات التعبئة وRFID</a>
    </nav>
    <a href="dashboard.html" class="back-link"><i class="bi bi-arrow-right"></i> رجوع للوحة الرئيسية</a>
  </aside>

  <main class="dashboard-main">
    <div id="deniedBox" class="d-none">
      <div class="card p-5 text-center">
        <i class="bi bi-shield-lock fs-1 text-danger mb-3"></i>
        <h4>هذا القسم مخصص للمدراء فقط</h4>
        <p class="text-muted mb-0">لا تملك صلاحية الوصول لخريطة المحطات.</p>
      </div>
    </div>

    <div id="content" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h2>خريطة المحطات</h2>
          <p class="text-muted mb-0">اضغط على أي محطة فاضية لتبدأ جلسة شحن لها مباشرة</p>
        </div>
        <button id="logoutBtn" class="btn btn-outline-danger">تسجيل الخروج</button>
      </div>

      <div class="d-flex gap-3 mb-4 flex-wrap small text-muted">
        <span><span class="status-badge status-done">●</span> فاضية</span>
        <span><span class="status-badge status-contacted">●</span> تشحن حاليًا</span>
        <span><span class="status-badge status-rejected">●</span> عطل</span>
        <span><span class="status-badge status-offline">●</span> غير متصلة</span>
      </div>

      <div id="stationsGrid" class="row g-3"></div>
    </div>
  </main>

  <script type="module" src="assets/js/ev-station-map.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
