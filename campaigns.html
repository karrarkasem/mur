<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الحملات والعروض | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <div class="brand"><img src="assets/img/logo.png" alt="مُر" class="logo-img on-dark" style="height:2.1rem"></div>
    <nav>
      <a href="dashboard.html"><i class="bi bi-grid"></i> لوحة التحكم</a>
      <a href="companies.html"><i class="bi bi-building"></i> الشركات</a>
      <a href="leads.html"><i class="bi bi-person-lines-fill"></i> العملاء المحتملون</a>
      <a href="tasks.html"><i class="bi bi-check2-square"></i> المهام</a>
      <a href="quotes.html"><i class="bi bi-file-earmark-text"></i> عروض الأسعار</a>
      <a href="users.html"><i class="bi bi-people"></i> المستخدمون</a>
      <a class="active" href="marketing.html"><i class="bi bi-megaphone"></i> التسويق</a>
      <a href="trash.html"><i class="bi bi-trash3"></i> سلة المحذوفات</a>
      <a href="settings.html"><i class="bi bi-gear"></i> الإعدادات</a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <a href="marketing.html" class="small text-muted text-decoration-none"><i class="bi bi-arrow-right"></i> التسويق</a>
        <h2>الحملات والعروض</h2>
      </div>
      <div class="d-flex gap-2">
        <button id="addBtn" class="btn btn-brand"><i class="bi bi-plus-lg"></i> حملة جديدة</button>
        <button id="logoutBtn" class="btn btn-outline-danger">تسجيل الخروج</button>
      </div>
    </div>

    <div class="data-toolbar">
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <select id="statusFilter" class="form-select" style="max-width:200px">
          <option value="all">كل الحملات</option>
          <option value="planned">مخطط لها</option>
          <option value="active">نشطة</option>
          <option value="ended">منتهية</option>
        </select>
        <button id="deleteSelectedBtn" class="btn btn-outline-danger btn-sm d-none"><i class="bi bi-trash"></i> حذف المحدد (<span id="selectedCount">0</span>)</button>
        <button id="deleteAllBtn" class="btn btn-outline-danger btn-sm d-none"><i class="bi bi-trash3"></i> حذف الكل</button>
      </div>
      <span class="text-muted small" id="countLabel"></span>
    </div>

    <div class="data-table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" id="selectAllCheckbox" class="d-none"></th>
            <th>اسم الحملة</th>
            <th>النوع</th>
            <th>الفئة المستهدفة</th>
            <th>الفترة</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="campaignsBody">
          <tr><td colspan="7" class="empty-state">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="campaignModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="campaignForm" style="display:contents">
          <div class="modal-header">
            <h5 class="modal-title" id="campaignModalTitle">حملة جديدة</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="campaignId">
            <div class="row">
              <div class="col-md-8 mb-3"><label class="form-label">اسم الحملة *</label><input required id="name" class="form-control" placeholder="مثال: عرض الصيف - خصم تركيب"></div>
              <div class="col-md-4 mb-3"><label class="form-label">النوع</label>
                <select id="type" class="form-select">
                  <option value="intro">عرض تعريفي</option>
                  <option value="promo">عرض ترويجي</option>
                  <option value="limited">عرض محدود المدة</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3"><label class="form-label">تاريخ البداية</label><input type="date" id="startDate" class="form-control"></div>
              <div class="col-md-4 mb-3"><label class="form-label">تاريخ النهاية</label><input type="date" id="endDate" class="form-control"></div>
              <div class="col-md-4 mb-3"><label class="form-label">الميزانية (د.ع)</label><input type="number" id="budget" class="form-control"></div>
            </div>
            <div class="mb-3"><label class="form-label">الفئة المستهدفة</label><input id="targetSegment" class="form-control" placeholder="مثال: مجمعات سكنية ببغداد، أو كل العملاء المحتملين"></div>
            <div class="mb-3"><label class="form-label">وصف العرض</label><textarea id="description" class="form-control" rows="3" placeholder="تفاصيل العرض وشنو يشمل"></textarea></div>
            <div class="mb-3"><label class="form-label">الحالة</label>
              <select id="status" class="form-select">
                <option value="planned">مخطط لها</option>
                <option value="active">نشطة</option>
                <option value="ended">منتهية</option>
              </select>
            </div>
            <div class="mb-2"><label class="form-label">النتائج / ملاحظات</label><textarea id="resultsNotes" class="form-control" rows="2" placeholder="عدد الطلبات اللي جتنا من هذي الحملة، ملاحظات..."></textarea></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
            <button type="submit" class="btn btn-brand">حفظ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/campaigns.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
