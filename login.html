<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول | مُر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-bg">
  <div class="auth-card">
    <span class="logo-mark d-block mb-3"><span class="m">M</span><span class="u">U</span><span class="r">R</span></span>
    <a href="index.html" class="text-decoration-none">← العودة للموقع</a>
    <h2 class="mt-3">دخول الفريق</h2>
    <p class="text-muted">استخدم البريد وكلمة المرور المسجلين في Firebase Authentication.</p>
    <form id="loginForm">
      <input id="email" class="form-control mb-3" type="email" placeholder="البريد الإلكتروني" required>
      <input id="password" class="form-control mb-3" type="password" placeholder="كلمة المرور" required>
      <button class="btn btn-brand w-100" type="submit">تسجيل الدخول</button>
      <div id="loginStatus" class="small mt-3"></div>
    </form>
  </div>
  <script type="module" src="modules/auth/login.js"></script>
</body>
</html>
